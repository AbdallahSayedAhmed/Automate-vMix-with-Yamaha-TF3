directories:
  output: dist_electron
  buildResources: build
appId: com.vmixyamahabridge.app
productName: vMix-Yamaha Bridge
asar: false
win:
  target: dir
  icon: public/program-image.ico
files:
  - filter:
      - dist/**/*
      - electron-main.js
      - electron-preload.cjs
      - package.json
extraResources:
  - from: ../backend/dist/backend.exe
    to: ../backend.exe
electronVersion: 42.4.1
